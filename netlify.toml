[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# Bundle the app/ package with the function
[functions]
  included_files = ["app/**"]

# Redirect /score POST requests to the serverless function
[[redirects]]
  from = "/score"
  to = "/.netlify/functions/api"
  status = 200

# Serve index.html for all other routes (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
